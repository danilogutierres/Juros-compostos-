<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<meta
    name="description"
    content="Simulador de Juros Compostos para calcular investimentos, aportes e crescimento do patrimônio."
>

<title>Simulador de Juros Compostos</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f6fa;
        color: #222;
        min-height: 100vh;
        padding-bottom: env(safe-area-inset-bottom);
    }

    header {
        background: linear-gradient(135deg, #111827, #2563eb);
        color: white;
        text-align: center;
        padding: calc(32px + env(safe-area-inset-top)) 20px 35px;
    }

    header h1 {
        margin: 0;
        font-size: clamp(24px, 7vw, 30px);
        line-height: 1.2;
    }

    header p {
        margin: 12px auto 0;
        font-size: 16px;
        line-height: 1.5;
        opacity: .9;
        max-width: 600px;
    }

    .container {
        width: 100%;
        max-width: 950px;
        margin: 25px auto;
        padding: 0 15px;
    }

    .card {
        background: white;
        padding: 22px;
        border-radius: 18px;
        margin-bottom: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, .08);
    }

    .card h2 {
        margin: 0 0 20px;
        color: #2563eb;
        font-size: 21px;
        line-height: 1.3;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 7px;
        font-weight: bold;
        line-height: 1.3;
    }

    .campo-moeda {
        position: relative;
    }

    .campo-moeda span {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-weight: bold;
        color: #555;
        pointer-events: none;
    }

    .campo-moeda input {
        padding-left: 45px;
    }

    input {
        width: 100%;
        padding: 14px;
        min-height: 48px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        background: white;
        color: #222;
        appearance: none;
    }

    input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    button {
        width: 100%;
        min-height: 50px;
        margin-top: 18px;
        padding: 14px 16px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation;
    }

    button:active {
        transform: scale(.99);
    }

    .botao-avancado {
        background: linear-gradient(135deg, #7c3aed, #5b21b6);
    }

    .botao-voltar {
        background: #64748b;
    }

    #areaAvancada {
        display: none;
    }

    .info-avancado {
        background: #f5f3ff;
        border-left: 4px solid #7c3aed;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        line-height: 1.6;
    }

    .fases {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .fase {
        background: #f8fafc;
        padding: 18px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
    }

    .fase h3 {
        margin-top: 0;
        color: #7c3aed;
        font-size: 18px;
    }

    .resultados {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    .resultado {
        background: #f8fafc;
        padding: 18px 12px;
        border-radius: 12px;
        text-align: center;
    }

    .resultado span {
        display: block;
        color: #666;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .resultado strong {
        font-size: clamp(18px, 5vw, 20px);
        color: #2563eb;
        word-break: break-word;
    }

    .destaque-avancado {
        display: none;
        margin-top: 20px;
        padding: 18px;
        background: #f5f3ff;
        border-radius: 12px;
        border-left: 5px solid #7c3aed;
        line-height: 1.5;
    }

    .destaque-avancado strong {
        color: #7c3aed;
    }

    .grafico-container {
        position: relative;
        width: 100%;
        height: 380px;
        overflow: hidden;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    .legenda {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 15px;
        font-size: 14px;
    }

    .item-legenda {
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .ponto {
        width: 12px;
        height: 12px;
        border-radius: 50%;
    }

    .patrimonio {
        background: #2563eb;
    }

    .aportes {
        background: #777;
    }

    .tabela-wrapper {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border-radius: 10px;
    }

    .tabela {
        width: 100%;
        min-width: 560px;
        border-collapse: collapse;
        margin-top: 10px;
    }

    .tabela th,
    .tabela td {
        padding: 12px 8px;
        border-bottom: 1px solid #ddd;
        text-align: right;
        white-space: nowrap;
    }

    .tabela th:first-child,
    .tabela td:first-child {
        text-align: left;
    }

    .tabela th {
        background: #f1f5f9;
    }

    .tabela tr:hover {
        background: #f8fafc;
    }

    footer {
        text-align: center;
        padding: 20px 15px;
        color: #777;
        font-size: 14px;
    }

    @media (max-width: 650px) {
        header {
            padding-left: 15px;
            padding-right: 15px;
        }

        .container {
            margin-top: 15px;
            padding: 0 10px;
        }

        .card {
            padding: 18px;
            border-radius: 15px;
        }

        .resultados {
            grid-template-columns: 1fr;
        }

        .fases {
            grid-template-columns: 1fr;
        }

        .grafico-container {
            height: 300px;
        }

        .card h2 {
            font-size: 20px;
        }
    }

    @media (max-width: 380px) {
        .card {
            padding: 15px;
        }

        .grafico-container {
            height: 270px;
        }

        header h1 {
            font-size: 23px;
        }
    }
</style>
