<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Simulador de Juros Compostos</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #222;
        }
        header {
            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #2563eb
                );
            color: white;
            text-align: center;
            padding: 40px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 30px;
        }
        header p {
            margin-top: 10px;
            font-size: 16px;
            opacity: 0.9;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);
        }
        .card h2 {
            margin-top: 0;
            color: #2563eb;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        /* CAMPOS */
        .campo-moeda {
            position: relative;
        }
        .campo-moeda span {
            position: absolute;
            left: 13px;
            top: 50%;
            transform:
                translateY(-50%);
            font-weight: bold;
            color: #555;
        }
        .campo-moeda input {
            padding-left: 45px;
        }
        input {
            width: 100%;
            padding: 13px;
            border:
                1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #2563eb;
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        .resultados {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 15px;
        }
        .resultado {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .resultado span {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .resultado strong {
            font-size: 20px;
            color: #2563eb;
        }
        canvas {
            width: 100%;
            max-height: 350px;
        }
        footer {
            text-align: center;
            padding: 25px;
            color: #777;
            font-size: 14px;
        }
        @media (max-width: 650px) {
            header h1 {
                font-size: 25px;
            }
            .resultados {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>
        💰 Simulador de Juros Compostos
    </h1>
    <p>
        O futuro vai chegar.
        Descubra quanto seu dinheiro pode valer até lá.
    </p>
</header>
<div class="container">
    <!-- SIMULADOR -->
    <div class="card">
        <h2>
            📊 Faça sua simulação
        </h2>
        <label>
            Valor inicial
        </label>
        <div class="campo-moeda">
            <span>R$</span>
            <input
                type="text"
                id="inicial"
                value="5.000,00"
                inputmode="decimal"
            >
        </div>
        <label>
            Aporte mensal
        </label>
        <div class="campo-moeda">
            <span>R$</span>
            <input
                type="text"
                id="aporte"
                value="5.000,00"
                inputmode="decimal"
            >
        </div>
        <label>
            Taxa de juros ao ano (%)
        </label>
        <input
            type="text"
            id="taxa"
            value="12"
            inputmode="decimal"
        >
        <label>
            Tempo (anos)
        </label>
        <input
            type="number"
            id="anos"
            value="10"
            min="1"
        >
        <button onclick="calcular()">
            🚀 Calcular investimento
        </button>
    </div>
    <!-- RESULTADOS -->
    <div class="card">
        <h2>
            💎 Resultado
        </h2>
        <div class="resultados">
            <div class="resultado">
                <span>
                    Total investido
                </span>
                <strong id="totalInvestido">
                    R$ 0,00
                </strong>
            </div>
            <div class="resultado">
                <span>
                    Juros ganhos
                </span>
                <strong id="juros">
                    R$ 0,00
                </strong>
            </div>
            <div class="resultado">
                <span>
                    Patrimônio final
                </span>
                <strong id="final">
                    R$ 0,00
                </strong>
            </div>
        </div>
    </div>
    <!-- GRÁFICO -->
    <div class="card">
        <h2>
            📈 Evolução do patrimônio
        </h2>
        <canvas id="grafico"></canvas>
    </div>
</div>
<footer>
    Simulador de Juros Compostos © 2026
</footer>
<script>
/* =========================
   CONVERTER R$ PARA NÚMERO
========================= */
function converterNumero(valor) {
    valor = valor
        .replace(/\./g, "")
        .replace(",", ".");
    return Number(valor) || 0;
}
/* =========================
   FORMATO BRASILEIRO
========================= */
function dinheiro(valor) {
    return valor.toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );
}
/* =========================
   CALCULAR
========================= */
function calcular() {
    const inicial =
        converterNumero(
            document.getElementById(
                "inicial"
            ).value
        );
    const aporte =
        converterNumero(
            document.getElementById(
                "aporte"
            ).value
        );
    const taxaAnual =
        converterNumero(
            document.getElementById(
                "taxa"
            ).value
        );
    const anos =
        Number(
            document.getElementById(
                "anos"
            ).value
        );
    if (
        inicial < 0 ||
        aporte < 0 ||
        taxaAnual < 0 ||
        anos <= 0
    ) {
        alert(
            "Digite valores válidos."
        );
        return;
    }
    /*
       Transformamos a taxa anual
       em uma taxa mensal equivalente.
    */
    const taxaMensal =
        Math.pow(
            1 + taxaAnual / 100,
            1 / 12
        ) - 1;
    const meses =
        anos * 12;
    let patrimonio =
        inicial;
    let totalInvestido =
        inicial;
    let valores =
        [patrimonio];
    let labels =
        ["Início"];
    for (
        let mes = 1;
        mes <= meses;
        mes++
    ) {
        patrimonio =
            patrimonio *
            (1 + taxaMensal);
        patrimonio += aporte;
        totalInvestido +=
            aporte;
        if (
            mes % 12 === 0 ||
            mes === meses
        ) {
            valores.push(
                patrimonio
            );
            labels.push(
                "Ano " +
                Math.ceil(
                    mes / 12
                )
            );
        }
    }
    const juros =
        patrimonio -
        totalInvestido;
    document.getElementById(
        "totalInvestido"
    ).innerText =
        dinheiro(
            totalInvestido
        );
    document.getElementById(
        "juros"
    ).innerText =
        dinheiro(
            juros
        );
    document.getElementById(
        "final"
    ).innerText =
        dinheiro(
            patrimonio
        );
    criarGrafico(
        labels,
        valores
    );
}
/* =========================
   GRÁFICO
========================= */
function criarGrafico(
    labels,
    valores
) {
    const canvas =
        document.getElementById(
            "grafico"
        );
    const ctx =
        canvas.getContext(
            "2d"
        );
    const largura =
        canvas.clientWidth * 2;
    const altura =
        350 * 2;
    canvas.width =
        largura;
    canvas.height =
        altura;
    ctx.clearRect(
        0,
        0,
        largura,
        altura
    );
    ctx.scale(2, 2);
    const w =
        largura / 2;
    const h =
        altura / 2;
    const margem =
        45;
    const maior =
        Math.max(
            ...valores
        );
    ctx.beginPath();
    valores.forEach(
        (valor, index) => {
            const x =
                margem +
                (
                    index /
                    (valores.length - 1)
                ) *
                (
                    w -
                    margem * 1.5
                );
            const y =
                h -
                margem -
                (
                    valor /
                    maior
                ) *
                (
                    h -
                    margem * 1.5
                );
            if (index === 0) {
                ctx.moveTo(
                    x,
                    y
                );
            } else {
                ctx.lineTo(
                    x,
                    y
                );
            }
        }
    );
    ctx.strokeStyle =
        "#2563eb";
    ctx.lineWidth =
        3;
    ctx.stroke();
    valores.forEach(
        (valor, index) => {
            const x =
                margem +
                (
                    index /
                    (valores.length - 1)
                ) *
                (
                    w -
                    margem * 1.5
                );
            const y =
                h -
                margem -
                (
                    valor /
                    maior
                ) *
                (
                    h -
                    margem * 1.5
                );
            ctx.beginPath();
            ctx.arc(
                x,
                y,
                4,
                0,
                Math.PI * 2
            );
            ctx.fillStyle =
                "#2563eb";
            ctx.fill();
        }
    );
}
/* =========================
   FORMATA OS CAMPOS
========================= */
document
    .getElementById("inicial")
    .addEventListener(
        "blur",
        function() {
            const valor =
                converterNumero(
                    this.value
                );
            this.value =
                valor.toLocaleString(
                    "pt-BR",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );
        }
    );
document
    .getElementById("aporte")
    .addEventListener(
        "blur",
        function() {
            const valor =
                converterNumero(
                    this.value
                );
            this.value =
                valor.toLocaleString(
                    "pt-BR",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );
        }
    );
/* Inicia automaticamente */
calcular();
</script>
</body>
</html>
